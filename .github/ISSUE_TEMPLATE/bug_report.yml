name: Bug report
description: Report a reproducible problem in hadzar.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, Supabase keys, private messages, or other personal data.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us what you did and what happened.
      placeholder: 1. Open… 2. Select… 3. Save…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android 15
